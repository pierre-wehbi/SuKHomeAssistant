<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/x-icon" href="https://cdn.autodesk.io/favicon.ico">
    <link rel="stylesheet" href="https://developer.api.autodesk.com/modelderivative/v2/viewers/7.*/style.css">
    <!-- Remove inspire-tree stylesheets -->
    <!-- <link rel="stylesheet" href="https://unpkg.com/inspire-tree-dom@4.0.6/dist/inspire-tree-light.min.css"> -->
    <link rel="stylesheet" href="/main.css">

    <title>SuK Home Assistant</title>
</head>

<body>
    <div id="header">
        <img class="logo" src="Logo_architekten.png" alt="SuK Logo">
        <span class="title">SuK Home Assistant</span>
        <button id="login" style="visibility: hidden;">Login</button>
    </div>
    <!-- Removed sidebar div -->
    <!-- <div id="sidebar">
        <div id="tree"></div>
    </div> -->
    <div id="preview"></div>
    <div id="ha-panel">
        <div class="ha-header">
            <h3>Home Assistant Monitor</h3>
            <button id="toggle-ha-panel" title="Toggle Panel">◀</button>
        </div>
        <div class="ha-content">
            <div class="ha-status-container">
                <div class="status-item">
                    <h4>Toilet Status</h4>
                    <div id="occupancyStatus" class="status-value">Unknown</div>
                </div>
                <div class="status-item">
                    <h4>Light Status</h4>
                    <div id="lightStatus" class="status-value">Unknown</div>
                </div>
            </div>
            <div class="connection-status">
                <span id="ha-connection-status" class="status disconnected">Connecting...</span>
            </div>
        </div>
    </div>
    <script src="https://developer.api.autodesk.com/modelderivative/v2/viewers/7.*/viewer3D.js"></script>
    <!-- Remove inspire-tree scripts -->
    <!-- <script src="https://cdnjs.cloudflare.com/ajax/libs/lodash.js/4.17.21/lodash.min.js"></script>
    <script src="https://unpkg.com/inspire-tree@4.3.1/dist/inspire-tree.js"></script>
    <script src="https://unpkg.com/inspire-tree-dom@4.0.6/dist/inspire-tree-dom.min.js"></script> -->
    <script src="/main.js" type="module"></script>
</body>

</html>
